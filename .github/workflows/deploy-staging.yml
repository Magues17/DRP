name: Build Staging

# On every push to `local`, run `npm run build` and force-push the
# resulting `dist/` contents to the `staging` branch. Hostinger's GIT
# integration is pointed at `staging`, so the compiled site is what
# lands in public_html.
#
# IMPORTANT: `staging` is a build-output branch — do not edit it by
# hand. Every run overwrites it with a single orphan commit.

on:
  push:
    branches: [local]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish dist/ to staging branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: staging
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Build from ${{ github.sha }}"
