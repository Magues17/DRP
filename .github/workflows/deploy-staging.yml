name: Build Staging

# When `staging` is updated, build the Vite app and publish the compiled
# `dist/` contents to the `staging-build` branch. Hostinger's GIT
# integration is configured to pull from `staging-build`, so the built
# site is what actually lands in public_html.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish dist/ to staging-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: staging-build
          # Single-commit history keeps the build branch tiny and obvious
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Build from ${{ github.sha }}"
